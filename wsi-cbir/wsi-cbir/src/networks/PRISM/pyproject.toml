[tool.black]
line-length = 100
skip-string-normalization = true
target-version = ['py38']

[tool.isort]
line_length = 100
profile = "black"
multi_line_output = 3
skip_glob = ['*.git/*']

[tool.flake8]
max-line-length = 100
select = ["C", "E", "F", "W", "B", "B950", "B902", "Q0", "ABS101"]
ignore = [
    "D203", # ignore 1 blank line required before class docstring
    "E203", # ignore whitespace before ':'
    "E501", # ignore line length too long
    "E704", # multiple statements on one line (def)
    "W503", # line break occurred before a binary operator
    "FI10", # disallow future import via flake8-future-imports
    "FI12",
    "FI11",
    "FI13",
    "FI14",
    "FI15",
    "FI16",
    "FI17",
    "FI18",
    "Q001",
    "E704",
    "E731",
]
inline-quotes = "single"
multiline-quotes = "'''"
docstring-quotes = '"""'
exclude = ["build/*", "dist/*", ".eggs/*", ".venv/*", ".git/*"]
